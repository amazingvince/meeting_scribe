[package]
name = "meeting-scribe"
version = "0.1.0"
description = "Local-first meeting transcription and RAG"
authors = ["Meeting Scribe"]
edition = "2021"
rust-version = "1.75"

[lib]
name = "meeting_scribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ============================================
# TAURI CORE
# ============================================
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# ============================================
# ASYNC RUNTIME
# ============================================
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# ============================================
# SERIALIZATION
# ============================================
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ============================================
# AUDIO CAPTURE & PROCESSING
# ============================================
cpal = "0.15"                    # Cross-platform audio I/O
hound = "3.5"                    # WAV file encoding/decoding
ringbuf = "0.4"                  # Lock-free ring buffers

# ============================================
# AUDIO PREPROCESSING
# ============================================
rubato = "0.15"                  # High-quality resampling
nnnoiseless = "0.5"              # RNNoise denoising (pure Rust)

# ============================================
# VOICE ACTIVITY DETECTION
# ============================================
voice_activity_detector = "0.2"  # Silero VAD v5
# Override ort to use load-dynamic feature (avoids MSVC version issues)
ort = { version = "2.0.0-rc.10", default-features = false, features = ["load-dynamic"] }

# ============================================
# TRANSCRIPTION
# ============================================
transcribe-rs = { git = "https://github.com/cjpais/transcribe-rs", features = ["parakeet"] }

# ============================================
# EMBEDDINGS
# ============================================
# Note: ort is already defined in VAD section with load-dynamic feature
tokenizers = "0.19"              # HuggingFace tokenizers for embedding models
ndarray = "0.16"                 # N-dimensional arrays for tensor operations
num_cpus = "1.16"                # CPU count for ONNX thread configuration

# ============================================
# LLM (commented - added in step 07)
# ============================================
# llama-cpp-2 = "0.1"

# ============================================
# STORAGE
# ============================================
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
# LanceDB - disable default features to avoid aws-lc-sys which requires cmake
lancedb = { version = "0.15", default-features = false }
arrow-array = "53"
arrow-schema = "53"
futures-util = "0.3"

# ============================================
# UTILITIES
# ============================================
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
dirs = "5"
reqwest = { version = "0.12", features = ["stream", "json"] }

# ============================================
# ARCHIVE EXTRACTION
# ============================================
flate2 = "1"                     # Gzip decompression
tar = "0.4"                      # Tar archive extraction
bzip2 = "0.5"                    # Bzip2 decompression
zip = "2"                        # Zip archive extraction

# ============================================
# PLATFORM-SPECIFIC
# ============================================
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_Foundation"
] }

[target.'cfg(target_os = "macos")'.dependencies]
# cidre = "0.4"                  # ScreenCaptureKit (added in step 10)

# ============================================
# BUILD CONFIGURATION
# ============================================
[features]
default = []
# GPU acceleration features (enable as needed)
cuda = []
metal = []
directml = []

# ============================================
# DEV DEPENDENCIES
# ============================================
[dev-dependencies]
tempfile = "3"                   # Temporary directories for tests

[profile.dev]
opt-level = 1                    # Some optimization in dev for audio

[profile.release]
lto = true
codegen-units = 1
strip = true
