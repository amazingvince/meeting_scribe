name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Release ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS Intel
            platform: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - name: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libasound2-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Protobuf compiler (protoc)
        uses: arduino/setup-protoc@v3

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage ONNX Runtime resource files (Unix)
        if: matrix.platform != 'windows-latest'
        run: |
          set -euo pipefail

          resource_dir="src-tauri/resources/runtime"
          mkdir -p "$resource_dir"
          find "$resource_dir" -mindepth 1 -delete

          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)
              url="https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-linux-x64-1.22.0.tgz"
              lib_glob='libonnxruntime*.so*'
              ;;
            aarch64-apple-darwin)
              url="https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-osx-arm64-1.22.0.tgz"
              lib_glob='libonnxruntime*.dylib'
              ;;
            x86_64-apple-darwin)
              url="https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-osx-x64-1.22.0.tgz"
              lib_glob='libonnxruntime*.dylib'
              ;;
            *)
              echo "Unsupported target for ONNX runtime staging: ${{ matrix.target }}"
              exit 1
              ;;
          esac

          archive="$(mktemp /tmp/onnxruntime.XXXXXX.tgz)"
          extract_dir="$(mktemp -d /tmp/onnxruntime.XXXXXX)"

          curl --fail --location --silent --show-error "$url" -o "$archive"
          tar -xzf "$archive" -C "$extract_dir"

          while IFS= read -r lib; do
            cp "$lib" "$resource_dir/"
          done < <(find "$extract_dir" -type f -name "$lib_glob")

          test -n "$(find "$resource_dir" -type f | head -n 1)"
          ls -la "$resource_dir"

      - name: Stage ONNX Runtime resource files (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $resourceDir = "src-tauri/resources/runtime"
          New-Item -ItemType Directory -Force -Path $resourceDir | Out-Null
          Get-ChildItem -Path $resourceDir -File -Force -ErrorAction SilentlyContinue | Remove-Item -Force

          $url = "https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-win-x64-1.22.0.zip"

          $archive = Join-Path $env:RUNNER_TEMP "onnxruntime-${{ matrix.target }}.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "onnxruntime-${{ matrix.target }}"
          if (Test-Path $extractDir) { Remove-Item -Recurse -Force $extractDir }
          New-Item -ItemType Directory -Path $extractDir | Out-Null

          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extractDir -Force

          $dlls = Get-ChildItem -Recurse -Path $extractDir -Filter "*.dll" | Where-Object { $_.Name -like "onnxruntime*.dll" }
          if (-not $dlls) { throw "No ONNX Runtime DLLs found in extracted archive" }
          foreach ($dll in $dlls) {
            Copy-Item $dll.FullName -Destination $resourceDir -Force
          }

          if (-not (Get-ChildItem $resourceDir -Filter "onnxruntime.dll" -ErrorAction SilentlyContinue)) {
            throw "onnxruntime.dll missing from staged runtime resources"
          }
          Get-ChildItem $resourceDir

      - name: Configure macOS deployment target
        if: contains(matrix.target, 'apple-darwin')
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
          echo "CMAKE_OSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      - name: Build and upload release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Meeting Scribe ${{ github.ref_name }}
          releaseBody: |
            Precompiled binaries for Meeting Scribe.
          releaseDraft: false
          prerelease: false
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Verify macOS bundle payload
        if: contains(matrix.target, 'apple-darwin')
        run: |
          set -euo pipefail

          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          app_path="$bundle_dir/macos/Meeting Scribe.app"
          dmg_path="$(ls "$bundle_dir"/dmg/*.dmg | head -n 1)"

          test -d "$app_path"
          test -f "$dmg_path"

          codesign --verify --deep --strict --verbose=2 "$app_path"

          app_runtime="$(find "$app_path/Contents/Resources/resources/runtime" -maxdepth 1 -type f -name 'libonnxruntime*.dylib' | head -n 1)"
          test -n "$app_runtime"
          echo "App runtime: $app_runtime"

          mount_point="$(mktemp -d /tmp/meeting-scribe-dmg.XXXXXX)"
          trap 'hdiutil detach "$mount_point" >/dev/null 2>&1 || true; rm -rf "$mount_point"' EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$dmg_path" >/dev/null

          dmg_app="$mount_point/Meeting Scribe.app"
          test -d "$dmg_app"
          codesign --verify --deep --strict --verbose=2 "$dmg_app"

          dmg_runtime="$(find "$dmg_app/Contents/Resources/resources/runtime" -maxdepth 1 -type f -name 'libonnxruntime*.dylib' | head -n 1)"
          test -n "$dmg_runtime"
          echo "DMG runtime: $dmg_runtime"

      - name: Verify Linux bundle payload
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -euo pipefail

          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          deb_file="$(ls "$bundle_dir"/deb/*.deb | head -n 1)"

          test -n "$deb_file"
          test -f "$deb_file"

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          pushd "$tmp_dir" >/dev/null

          ar x "$GITHUB_WORKSPACE/$deb_file" data.tar.gz
          tar -tzf data.tar.gz > deb-contents.txt

          grep -E 'usr/bin/meeting-scribe$' deb-contents.txt
          grep -E 'libonnxruntime\.so' deb-contents.txt

          popd >/dev/null

      - name: Verify Windows bundle payload
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $bundleDir = "src-tauri/target/${{ matrix.target }}/release/bundle"
          $msi = Get-ChildItem "$bundleDir/msi/*.msi" | Select-Object -First 1
          $nsis = Get-ChildItem "$bundleDir/nsis/*.exe" | Select-Object -First 1

          if (-not $msi) { throw "No MSI artifact found in $bundleDir/msi" }
          if (-not $nsis) { throw "No NSIS artifact found in $bundleDir/nsis" }

          $extractDir = Join-Path $env:RUNNER_TEMP "msi-extract-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null

          $args = @("/a", "`"$($msi.FullName)`"", "/qn", "TARGETDIR=`"$extractDir`"")
          $process = Start-Process -FilePath "msiexec.exe" -ArgumentList $args -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "msiexec admin extraction failed with exit code $($process.ExitCode)"
          }

          $appExe = Get-ChildItem -Recurse -Path $extractDir -Filter "meeting-scribe.exe" | Select-Object -First 1
          $ortDll = Get-ChildItem -Recurse -Path $extractDir -Filter "onnxruntime.dll" | Select-Object -First 1

          if (-not $appExe) { throw "meeting-scribe.exe missing from extracted MSI payload" }
          if (-not $ortDll) { throw "onnxruntime.dll missing from extracted MSI payload" }
