name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - 'release/**'

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Build, Test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libasound2-dev \
            patchelf \
            protobuf-compiler

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm lint

      - name: Build frontend
        run: pnpm build

      - name: Run Rust tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --no-run

          ORT_LIB=$(find src-tauri/target -type f -name 'libonnxruntime.so*' | head -n 1)
          if [ -z "$ORT_LIB" ]; then
            echo "Could not locate libonnxruntime.so after building tests"
            exit 1
          fi

          export ORT_DYLIB_PATH="$ORT_LIB"
          export LD_LIBRARY_PATH="$(dirname "$ORT_LIB"):${LD_LIBRARY_PATH:-}"
          cargo test --manifest-path src-tauri/Cargo.toml --locked
